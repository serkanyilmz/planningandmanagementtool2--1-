spring:
  application:
    name: planify
  datasource:
    url: jdbc:postgresql://localhost:5432/planify
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:PlanifyJwtSecretKeyForDevelopmentOnlyChangeMe123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
